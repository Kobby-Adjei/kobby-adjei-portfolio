<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference Film Method</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #050506; color: #eceae4;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding-inline: 16px; padding-block: 16px; box-sizing: border-box; min-height: 100%;
  }
  #frame { position: relative; overflow: hidden; border-radius: 6px; background: #0b0d10; flex: none; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

  .h {
    position: absolute; left: 960px; width: 1760px; text-align: center;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-stretch: 125%;
    letter-spacing: -.02em; line-height: 1.02; text-wrap: balance; opacity: 0;
  }
  .h .w { display: inline-block; margin-right: .24em; will-change: transform; }
  .h .w:last-child { margin-right: 0; }
  .h .g { color: #16c478; }
  .h.strike { font-weight: 600; text-decoration: line-through; text-decoration-thickness: 6px; }

  #cap {
    position: absolute; left: 210px; right: 210px; bottom: 50px; text-align: center;
    font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 56px;
    line-height: 1.2; text-wrap: balance; opacity: 0;
  }
  .lbl { position: absolute; top: 54px; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; opacity: 0; }
  #chap { left: 84px; }
  #ill { right: 84px; }

  #counter {
    position: absolute; left: 960px; top: 460px; transform: translate(-50%, -50%);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-stretch: 125%;
    font-size: 190px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap;
    color: #fff; opacity: 0;
  }
  #counterLbl {
    position: absolute; left: 960px; top: 590px; transform: translateX(-50%);
    font-size: 24px; letter-spacing: .22em; color: #8d8b85; opacity: 0; white-space: nowrap;
  }
  #openIcon { position: absolute; left: 850px; top: 430px; width: 220px; height: 220px; opacity: 0; }
  #brand {
    position: absolute; left: 960px; top: 720px; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 26px; opacity: 0;
  }
  #brand img { width: 96px; height: 96px; }
  #brand span {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-stretch: 125%;
    font-size: 64px; color: #fff; letter-spacing: -.01em;
  }
  #foot {
    position: absolute; left: 0; right: 0; bottom: 50px; text-align: center;
    font-size: 20px; letter-spacing: .05em; color: #8d8b85; opacity: 0;
  }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; flex: none; }
  .bar button {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; font-weight: 500;
    padding: 8px 14px; border-radius: 5px; border: 1px solid #3a3a3f; background: #141417;
    color: #eceae4; cursor: pointer;
  }
  .bar button:hover { border-color: #6a6a70; }
  .bar button:focus-visible, #scrub:focus-visible { outline: 2px solid #16c478; outline-offset: 2px; }
  #pp { min-width: 84px; background: #eceae4; color: #050506; border-color: #eceae4; }
  #scrub {
    position: relative; flex: 1 1 200px; min-width: 160px; height: 28px; cursor: pointer;
    touch-action: none;
  }
  #scrub .rail { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: #2a2a2f; }
  #fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: #16c478; width: 0; }
  #scrub .tick { position: absolute; top: 8px; width: 2px; height: 12px; background: #55555c; border-radius: 1px; }
  #clock { font-size: 13px; color: #9a9892; font-variant-numeric: tabular-nums; min-width: 92px; }
  .speed { display: flex; align-items: center; gap: 6px; }
  .speed span { font-size: 12px; color: #9a9892; letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
  .speed button { padding: 7px 10px; }
  .speed button[aria-pressed="true"] { background: #16c478; border-color: #16c478; color: #050506; }
</style>
</head>

<script>
(() => {
  const DUR = 90;
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');

  const COL = {
    black: [11, 13, 16], red: [232, 25, 44], paper: [243, 239, 230], green: [22, 196, 120],
    ink: [17, 18, 22], gb: [74, 76, 84], gp: [192, 186, 174], light: [226, 221, 210],
    muted: [118, 114, 105]
  };
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const E = {
    io: (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
    in: (k) => k * k * k,
    out: (k) => 1 - Math.pow(1 - k, 3),
    lin: (k) => k
  };
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const win = (t, a, b, f = .3) => clamp((t - a) / f) * (1 - clamp((t - b) / f));
  function rng(s) { return () => (s = s * 16807 % 2147483647) / 2147483647; }
  const R = rng(20260928);

  // The numbers, for a 4,000 film catalogue. Every pair is compared in both orders.
  const N = 4000, SEED = 30, RUNGS = 6;
  const ALL = N * (N - 1);                  // 15,996,000
  const SEED_C = SEED * (SEED - 1);         // 870
  const SCREEN_C = (N - SEED) * RUNGS * 2;  // 47,640
  const SURV = Math.round(N / (SEED + 1));  // films expected to beat the best of 30 random films
  const FINAL_C = SURV * (SURV - 1);
  const TOTAL = SEED_C + SCREEN_C + FINAL_C;
  const DAYS_ALL = Math.round(ALL / 18 / 60 / 24);
  const PCT = (100 * (1 - TOTAL / ALL)).toFixed(1);

  // ---------- entities
  const BOX = { x0: 130, x1: 1790, y0: 150, y1: 860 };
  const scatter = () => [lerp(BOX.x0, BOX.x1, R()), lerp(BOX.y0, BOX.y1, R())];
  const C = 1000;
  const cat = [];
  for (let i = 0; i < C; i++) { const [sx, sy] = scatter(); cat.push({ sx, sy, q: R(), k: [] }); }
  const seeds = [];
  for (let j = 0; j < SEED; j++) { const [sx, sy] = scatter(); seeds.push({ sx, sy, q: R(), k: [], j }); }
  const ranked = [...seeds].sort((a, b) => b.q - a.q);
  ranked.forEach((s, k) => { s.rank = k; });
  const rungs = [];
  for (let i = 0; i < RUNGS; i++) {
    const s = ranked[Math.round(i * (SEED - 1) / (RUNGS - 1))];
    s.rung = i; rungs.push(s);
  }
  const RY = [220, 330, 440, 550, 660, 770];
  const bandCenter = (g) => (g === 0 ? 160 : g === 6 ? 825 : (RY[g - 1] + RY[g]) / 2);

  const groups = [[], [], [], [], [], [], []];
  cat.forEach((c) => { c.b = rungs.filter((r) => c.q > r.q).length; groups[6 - c.b].push(c); });
  groups.forEach((g, gi) => {
    const cols = 44, rows = Math.ceil(g.length / cols);
    g.forEach((c, n) => {
      c.bx = 520 + (n % cols) * (1300 / (cols - 1));
      c.by = bandCenter(gi) + (Math.floor(n / cols) - (rows - 1) / 2) * 14;
    });
  });
  let surv = cat.filter((c) => c.b === 6);
  if (surv.length < 18) surv = [...cat].sort((a, b) => b.q - a.q).slice(0, 24);
  surv.forEach((c, i) => {
    c.surv = true;
    const a = (i / surv.length) * Math.PI * 2 - Math.PI / 2;
    c.cx = 960 + Math.cos(a) * 300; c.cy = 480 + Math.sin(a) * 300;
  });
  surv.reduce((best, c) => (c.q > best.q ? c : best), surv[0]).win = true;

  const pairs = [];
  for (let i = 0; i < surv.length; i++) for (let j = i + 1; j < surv.length; j++) pairs.push([i, j]);
  for (let i = pairs.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [pairs[i], pairs[j]] = [pairs[j], pairs[i]]; }
  const LN = 2600, lines = [];
  for (let i = 0; i < LN; i++) lines.push([Math.floor(R() * C), Math.floor(R() * C)]);

  // ---------- keyframes: every dot is a pure function of time, so scrubbing works
  function key(e, t, p, ease = 'io') {
    const last = e.k[e.k.length - 1];
    e.k.push(Object.assign({}, last || {}, p, { t, ease }));
  }
  function sample(e, t) {
    const K = e.k;
    if (t <= K[0].t) return K[0];
    for (let i = 1; i < K.length; i++) {
      if (t < K[i].t) {
        const a = K[i - 1], b = K[i];
        const u = b.t === a.t ? 1 : E[b.ease]((t - a.t) / (b.t - a.t));
        return {
          x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), r: lerp(a.r, b.r, u), a: lerp(a.a, b.a, u),
          c: [lerp(a.c[0], b.c[0], u), lerp(a.c[1], b.c[1], u), lerp(a.c[2], b.c[2], u)]
        };
      }
    }
    return K[K.length - 1];
  }

  cat.forEach((c, i) => {
    const st = i / C;
    key(c, 0, { x: c.sx, y: c.sy, r: 3.5, a: 0, c: COL.gb });
    key(c, 7.0 + st * .9, { a: 0 });
    key(c, 7.4 + st * .9, { a: 1 });
    key(c, 17.0, {});
    key(c, 18.2, { x: 960, y: 540, r: 1.5, a: 0 }, 'in');
    key(c, 22.4 + st * .6, { x: c.sx, y: c.sy, r: 3.5, a: 0, c: COL.gp }, 'lin');
    key(c, 22.9 + st * .6, { a: 1 });
    key(c, 26.0, {});
    key(c, 27.0, { a: .06 });
    c.ta = 49.5 + st * 6.0;
    key(c, c.ta, {});
    key(c, c.ta + .9, { x: c.bx, y: c.by, a: 1, c: COL.ink });
    key(c, 59.6, {});
    if (!c.surv) {
      key(c, 61.2, { r: 2.5, a: .7, c: COL.light });
      key(c, 65.6, {});
      key(c, 66.6, { a: .08 });
      key(c, 73.3, {});
      key(c, 74.0, { a: 0 });
    } else {
      key(c, 66.0, {});
      key(c, 68.0, { x: c.cx, y: c.cy, r: 8 });
      key(c, 71.8, {});
      if (c.win) {
        key(c, 72.8, { x: 960, y: 480, r: 28, c: COL.green });
        key(c, 73.5, {});
        key(c, 74.5, { r: 1300 }, 'in');
        key(c, 74.56, { a: 0 }, 'lin');
      } else {
        key(c, 73.3, {});
        key(c, 74.0, { a: 0 });
      }
    }
  });

  seeds.forEach((s) => {
    const st = s.j / SEED;
    const ang = st * Math.PI * 2 - Math.PI / 2;
    const cx = 960 + Math.cos(ang) * 230, cy = 500 + Math.sin(ang) * 230;
    s.tp = 30.0 + s.rank * 0.2;
    key(s, 0, { x: s.sx, y: s.sy, r: 3.5, a: 0, c: COL.gp });
    key(s, 22.4 + st * .6, { a: 0 });
    key(s, 22.9 + st * .6, { a: 1 });
    key(s, 24.0 + st * .4, {});
    key(s, 25.0 + st * .4, { r: 10, c: COL.ink });
    key(s, 26.0, {});
    key(s, 27.5, { x: cx, y: cy });
    key(s, s.tp, {});
    key(s, s.tp + .5, { x: 960, y: 150 + s.rank * (710 / (SEED - 1)), r: 8 });
    key(s, 39.5, {});
    if (s.rung !== undefined) {
      key(s, 41.0, { x: 300, y: RY[s.rung], r: 15, c: COL.red });
      key(s, 65.6, {});
      key(s, 66.6, { a: 0 });
    } else {
      key(s, 40.0, {});
      key(s, 41.0, { a: 0 });
    }
  });

  // ---------- backgrounds: flat fields, changed by a circle wipe from the centre
  const BG = [
    { t: 0, c: COL.black }, { t: 14.0, c: COL.red, w: .7 }, { t: 18.2, c: COL.black, w: .6 },
    { t: 22.0, c: COL.paper, w: .8 }, { t: 74.5, c: COL.green, w: 0 }, { t: 83.0, c: COL.black, w: .7 }
  ];
  function bgState(t) {
    let i = 0;
    for (let k = 0; k < BG.length; k++) if (t >= BG[k].t) i = k;
    const cur = BG[i], prev = BG[Math.max(0, i - 1)];
    return { from: prev.c, to: cur.c, p: cur.w ? clamp((t - cur.t) / cur.w) : 1 };
  }
  const bgFor = (t) => { const s = bgState(t); return s.p > .5 ? s.to : s.from; };
  const isLight = (c) => (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255 > .5;

  // ---------- words, captions, chapters
  const HL = [
    { t: 1.7, o: 6.6, y: 400, s: 170, txt: '4,000 films.' },
    { t: 2.8, o: 6.6, y: 590, s: 104, txt: 'Which ones get the *money?*' },
    { t: 14.2, o: 16.6, y: 500, s: 200, txt: `${DAYS_ALL} days.` },
    { t: 18.6, o: 21.8, y: 500, s: 116, txt: 'There is a faster way.' },
    { t: 75.0, o: 82.6, y: 370, s: 240, txt: fmt(TOTAL) },
    { t: 75.9, o: 82.6, y: 540, s: 70, txt: fmt(ALL), cls: 'strike', dim: .5 },
    { t: 77.8, o: 82.6, y: 690, s: 104, txt: `${PCT}% less work.` },
    { t: 83.6, o: 99, y: 390, s: 72, txt: 'The best films still rise to the top.' },
    { t: 85.0, o: 99, y: 500, s: 72, txt: 'For a fraction of the *work.*' }
  ];
  const CAP = [
    [3.9, 7.0, 'A new catalogue arrives, and nobody has watched any of it yet.'],
    [7.5, 11.5, 'The obvious way is to compare every film with every other film.'],
    [11.5, 14.0, 'That is almost 16 million comparisons.'],
    [14.2, 17.0, `At the speed the engine runs today, that is ${DAYS_ALL} days of nonstop work.`],
    [19.2, 22.0, 'It finds the best films with a tiny fraction of the comparisons.'],
    [22.8, 26.0, 'Start by pulling 30 films out of the catalogue at random.'],
    [26.0, 29.5, 'We know nothing about them yet, so random is the fair way to choose.'],
    [30.0, 34.2, 'Rank those 30 against each other, every film against every other one.'],
    [34.2, 39.0, `That is only ${fmt(SEED_C)} comparisons, about 48 minutes, and it gives us a ladder.`],
    [39.6, 44.2, 'Keep six of them as reference films. The best, the worst, and four in between.'],
    [44.2, 49.0, 'Not the top six. If every reference were a hit, every film would lose to all of them and look the same.'],
    [49.6, 54.2, 'Every other film plays the same six reference films.'],
    [54.2, 59.0, 'Because the six never change, every film lands on one shared scale.'],
    [59.6, 65.5, 'Only films that beat every reference go through. Everything else is finished, and we stop spending on it.'],
    [66.0, 70.0, `The roughly ${Math.round(SURV / 10) * 10} films that beat every reference get a proper contest.`],
    [70.0, 74.0, 'That is where precision matters, because that is where the money goes.'],
    [75.4, 79.2, `${fmt(TOTAL)} comparisons instead of almost 16 million.`],
    [79.2, 83.0, `About two and a half days of work instead of ${DAYS_ALL}.`]
  ];
  const CH = [
    [7, 17, 'The obvious way'], [22, 29.5, '01 · Take a sample'], [29.5, 39, '02 · Rank the sample'],
    [39, 49, '03 · Pick reference films'], [49, 59, '04 · Screen the catalogue'], [59, 65.5, '05 · Let most go'],
    [65.5, 74, '06 · The final'], [74.5, 83, 'The result']
  ];

  const heads = $('heads');
  HL.forEach((h) => {
    const el = document.createElement('div');
    el.className = 'h' + (h.cls ? ' ' + h.cls : '');
    el.style.fontSize = h.s + 'px';
    el.style.top = h.y + 'px';
    h.words = h.txt.split(' ').map((w) => {
      const sp = document.createElement('span');
      const green = /^\*.*\*$/.test(w);
      sp.className = 'w' + (green ? ' g' : '');
      sp.textContent = green ? w.slice(1, -1) : w;
      el.appendChild(sp);
      return sp;
    });
    heads.appendChild(el);
    h.el = el;
  });
  $('foot').textContent = 'Illustration. A 4,000 film catalogue at the engine’s current 18 calls a minute. Every pair is compared in both orders.';

  // ---------- drawing
  function drawBg(t) {
    const s = bgState(t);
    if (s.p >= 1) { ctx.fillStyle = rgb(s.to); ctx.fillRect(0, 0, 1920, 1080); return; }
    ctx.fillStyle = rgb(s.from); ctx.fillRect(0, 0, 1920, 1080);
    ctx.fillStyle = rgb(s.to);
    ctx.beginPath(); ctx.arc(960, 540, E.io(s.p) * 1110, 0, 6.2832); ctx.fill();
  }
  function label(txt, x, y, a, align = 'left') {
    if (a <= 0) return;
    ctx.globalAlpha = a; ctx.fillStyle = rgb(COL.muted);
    ctx.font = '500 20px "IBM Plex Mono", ui-monospace, monospace';
    ctx.textAlign = align;
    if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
    ctx.fillText(txt, x, y);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
  function dot(e, t) {
    const p = e.p;
    if (p.a < .01) return;
    ctx.globalAlpha = p.a; ctx.fillStyle = rgb(p.c);
    if (e.rung !== undefined && t >= 40.2) ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.5, p.r), 0, 6.2832); ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  function paint(t) {
    drawBg(t);
    for (let i = 0; i < C; i++) cat[i].p = sample(cat[i], t);
    for (const s of seeds) s.p = sample(s, t);

    // everyone against everyone
    if (t > 8 && t < 18.2) {
      const n = Math.floor(E.in(clamp((t - 8) / 5.5)) * LN);
      if (n > 0) {
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const a = cat[lines[i][0]].p, b = cat[lines[i][1]].p;
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        }
        ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1; ctx.stroke();
      }
    }

    // the ladder the six references make
    const rl = clamp((t - 41) / .8) * (1 - clamp((t - 65.6) / 1));
    if (rl > 0) {
      ctx.strokeStyle = rgb(COL.red, .28 * rl); ctx.lineWidth = 2; ctx.beginPath();
      rungs.forEach((r) => { ctx.moveTo(340, RY[r.rung]); ctx.lineTo(1850, RY[r.rung]); });
      ctx.stroke();
    }

    // each film playing the references
    if (t > 49.5 && t < 57) {
      ctx.lineWidth = 1.2;
      for (let i = 0; i < C; i += 2) {
        const c = cat[i], u = (t - c.ta) / .9;
        if (u < 0 || u >= 1) continue;
        const r = rungs[i % RUNGS].p;
        ctx.strokeStyle = rgb(COL.red, .35 * (1 - u));
        ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(c.p.x, c.p.y); ctx.stroke();
      }
    }

    // the final: survivors against each other
    if (t > 68.2 && t < 72) {
      const f = 1 - clamp((t - 71.4) / .6);
      const n = Math.floor(E.io(clamp((t - 68.2) / 3)) * pairs.length);
      ctx.lineWidth = 1.2; ctx.strokeStyle = rgb(COL.ink, .10 * f); ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a = surv[pairs[i][0]].p, b = surv[pairs[i][1]].p;
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      }
      ctx.stroke();
      ctx.lineWidth = 3; ctx.strokeStyle = rgb(COL.ink, .85 * f); ctx.beginPath();
      for (let i = Math.max(0, n - 2); i < n; i++) {
        const a = surv[pairs[i][0]].p, b = surv[pairs[i][1]].p;
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      }
      ctx.stroke();
    }

    // ranking the 30: one duel at a time
    if (t >= 30 && t < 36.4) {
      for (const s of seeds) {
        const u = t - s.tp;
        if (u < 0 || u >= .3) continue;
        const o = ranked[(s.rank * 7 + 11) % SEED];
        if (o === s) continue;
        const a = s.p, b = o.p, f = 1 - u / .3;
        ctx.strokeStyle = rgb(COL.ink, .9 * f); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        [a, b].forEach((p) => { ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 11, 0, 6.2832); ctx.stroke(); });
        ctx.globalAlpha = f; ctx.fillStyle = rgb(COL.ink);
        ctx.font = 'italic 38px "Instrument Serif", Georgia, serif'; ctx.textAlign = 'center';
        ctx.fillText('vs', (a.x + b.x) / 2, (a.y + b.y) / 2 - 16);
        ctx.textAlign = 'left'; ctx.globalAlpha = 1;
      }
    }

    for (let i = 0; i < C; i++) dot(cat[i], t);
    for (const s of seeds) dot(s, t);

    const placed = seeds.filter((s) => t >= s.tp + .5).length;
    label(`${placed} / 30 ranked`.toUpperCase(), 1000, 158, win(t, 30, 36.4));
    label('BEST', 1000, 158, win(t, 36.5, 39.2));
    label('WORST', 1000, 868, win(t, 36.5, 39.2));
    label('REFERENCE FILMS', 300, 180, win(t, 41.5, 65.6), 'center');
    label('BEST', 268, RY[0] + 7, win(t, 41.5, 65.6), 'right');
    label('WORST', 268, RY[5] + 7, win(t, 41.5, 65.6), 'right');
    label('BEAT ALL SIX', 520, 116, win(t, 53, 65.6));
  }

  function words(h, t, fg) {
    const exit = clamp((t - h.o) / .35);
    const on = t >= h.t - .05 && exit < 1;
    h.el.style.opacity = on ? (1 - exit) * (h.dim || 1) : 0;
    if (!on) return;
    h.el.style.color = fg;
    h.el.style.transform = `translate(-50%, -50%) translateY(${-30 * exit}px)`;
    h.words.forEach((w, i) => {
      const tau = t - (h.t + i * .09);
      if (tau < 0) { w.style.opacity = 0; w.style.transform = 'translateY(70px)'; w.style.filter = 'blur(10px)'; return; }
      const off = 70 * Math.exp(-5.5 * tau) * Math.cos(10 * tau);
      const b = Math.max(0, 10 * (1 - tau / .35));
      w.style.opacity = clamp(tau / .2);
      w.style.transform = `translateY(${off}px)`;
      w.style.filter = b > .1 ? `blur(${b}px)` : 'none';
    });
  }

  function render(t) {
    paint(t);
    const fg = isLight(bgFor(t)) ? '#111216' : '#ffffff';
    HL.forEach((h) => words(h, t, fg));

    const cap = $('cap'), c = CAP.find((x) => t >= x[0] && t < x[1]);
    if (c) {
      if (cap.textContent !== c[2]) cap.textContent = c[2];
      cap.style.opacity = Math.min(clamp((t - c[0]) / .3), clamp((c[1] - t) / .3));
      cap.style.color = fg;
    } else cap.style.opacity = 0;

    const chap = $('chap'), ch = CH.find((x) => t >= x[0] && t < x[1]);
    if (ch) {
      if (chap.textContent !== ch[2]) chap.textContent = ch[2];
      chap.style.opacity = win(t, ch[0], ch[1]) * .75;
      chap.style.color = fg;
    } else chap.style.opacity = 0;
    $('ill').style.opacity = win(t, 7, 74, .4) * .5;
    $('ill').style.color = fg;

    const counter = $('counter');
    const co = win(t, 8.3, 13.6, .4);
    counter.style.opacity = co; $('counterLbl').style.opacity = co;
    if (co > 0) counter.textContent = fmt(ALL * E.out(clamp((t - 8.5) / 4.5)));

    const it = t - .15, icon = $('openIcon');
    icon.style.opacity = clamp(it / .25) * (1 - clamp((t - 1.2) / .3));
    icon.style.transform = `scale(${it < 0 ? .6 : 1 - .4 * Math.exp(-6 * it) * Math.cos(9 * it)})`;

    const bt = t - 86.6, brand = $('brand');
    brand.style.opacity = clamp(bt / .4);
    brand.style.transform = `translate(-50%, -50%) translateY(${bt < 0 ? 40 : 40 * Math.exp(-5 * bt) * Math.cos(9 * bt)}px)`;
    $('foot').style.opacity = clamp((t - 86.9) / .5);

    $('fill').style.width = (t / DUR * 100) + '%';
    const mm = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
    $('clock').textContent = mm(t) + ' / ' + mm(DUR);
    $('scrub').setAttribute('aria-valuenow', Math.round(t));
  }

  // ---------- playback
  let t = 0, playing = false, speed = 1, last = performance.now();
  const pp = $('pp');
  const setPP = () => { pp.textContent = playing ? 'Pause' : (t >= DUR ? 'Replay' : 'Play'); };
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (playing) { t += dt * speed; if (t >= DUR) { t = DUR; playing = false; setPP(); } }
    render(t);
    requestAnimationFrame(loop);
  }
  pp.onclick = () => { if (t >= DUR) t = 0; playing = !playing; setPP(); };
  $('rs').onclick = () => { t = 0; playing = true; setPP(); };
  document.querySelectorAll('.speed button').forEach((b) => {
    b.onclick = () => {
      speed = +b.dataset.s;
      document.querySelectorAll('.speed button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    };
  });

  const scrub = $('scrub');
  CH.forEach((c) => {
    const tk = document.createElement('div');
    tk.className = 'tick'; tk.style.left = (c[0] / DUR * 100) + '%'; tk.title = c[2];
    scrub.appendChild(tk);
  });
  let dragging = false;
  const seek = (e) => { const r = scrub.getBoundingClientRect(); t = clamp((e.clientX - r.left) / r.width) * DUR; setPP(); };
  scrub.addEventListener('pointerdown', (e) => { dragging = true; scrub.setPointerCapture(e.pointerId); seek(e); });
  scrub.addEventListener('pointermove', (e) => { if (dragging) seek(e); });
  scrub.addEventListener('pointerup', () => { dragging = false; });
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
    if (e.key === ' ') { e.preventDefault(); pp.click(); }
    if (e.key === 'ArrowRight') { t = Math.min(DUR, t + 5); setPP(); }
    if (e.key === 'ArrowLeft') { t = Math.max(0, t - 5); setPP(); }
  });

  function fit() {
    const barH = $('bar').offsetHeight + 46;
    const w = Math.max(280, Math.min(window.innerWidth - 32, (window.innerHeight - barH) * 16 / 9));
    const f = $('frame');
    f.style.width = w + 'px'; f.style.height = (w * 9 / 16) + 'px';
    $('stage').style.transform = `scale(${w / 1920})`;
    $('bar').style.width = w + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  requestAnimationFrame(loop);

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ready = document.fonts ? document.fonts.ready : Promise.resolve();
  ready.then(() => { if (!reduce) { playing = true; last = performance.now(); setPP(); } });
})();
</script>
</body>
</html>
